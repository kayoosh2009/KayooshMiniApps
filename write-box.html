<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мои Тетради</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #eef2f3;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Кнопка меню (иконка) */
        .menu-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            cursor: pointer;
            z-index: 10;
            transition: transform 0.2s;
        }

        .menu-btn:hover {
            transform: scale(1.1);
        }

        .menu-btn img {
            width: 32px;
            height: 32px;
            display: block;
        }

        /* Боковое меню */
        .sidebar {
            position: fixed;
            top: 0;
            left: -300px;
            width: 300px;
            height: 100%;
            background-color: #2c3e50;
            color: #fff;
            padding: 60px 20px 20px 20px;
            transition: left 0.3s ease;
            z-index: 5;
            box-shadow: 5px 0 15px rgba(0,0,0,0.2);
            display: flex;
            flex-direction: column;
        }

        .sidebar.active {
            left: 0;
        }

        .sidebar h2 {
            margin-bottom: 20px;
            font-size: 1.5rem;
            text-align: center;
            border-bottom: 1px solid #34495e;
            padding-bottom: 10px;
        }

        /* Список тетрадей */
        .notebook-list {
            list-style: none;
            overflow-y: auto;
            flex-grow: 1;
            margin-bottom: 20px;
        }

        .notebook-item {
            padding: 12px;
            background-color: #34495e;
            margin-bottom: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .notebook-item:hover, .notebook-item.active {
            background-color: #1abc9c;
        }

        .delete-btn {
            background: none;
            border: none;
            color: #e74c3c;
            font-weight: bold;
            cursor: pointer;
            padding: 0 5px;
        }

        .delete-btn:hover {
            color: #fff;
        }

        /* Кнопка создания тетради */
        .create-btn {
            width: 100%;
            padding: 12px;
            background-color: #1abc9c;
            border: none;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }

        .create-btn:hover {
            background-color: #16a085;
        }

        /* Тетрадный лист */
        .notebook-page {
            background: #ffffff;
            width: 90%;
            max-width: 650px;
            height: 80vh;
            padding: 40px;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Заголовок внутри листа */
        .page-title {
            text-align: center;
            font-size: 1.8rem;
            color: #333;
            margin-bottom: 20px;
            border: none;
            outline: none;
            font-weight: bold;
            width: 100%;
        }

        /* Поле для текста (по центру) */
        .page-content {
            width: 100%;
            flex-grow: 1;
            resize: none;
            border: none;
            outline: none;
            font-size: 1.2rem;
            line-height: 1.6;
            color: #444;
            text-align: center;
            background: transparent;
        }

        /* Заглушка, если ничего не выбрано */
        .placeholder-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #95a5a6;
            font-size: 1.2rem;
            text-align: center;
            pointer-events: none;
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- Иконка меню -->
    <div class="menu-btn" id="menuBtn">
        <img src="icon/menu.png" alt="Menu">
    </div>

    <!-- Боковое меню (Сайдбар) -->
    <div class="sidebar" id="sidebar">
        <h2>Мои Тетради</h2>
        <ul class="notebook-list" id="notebookList">
            <!-- Тетради будут добавляться сюда динамически -->
        </ul>
        <button class="create-btn" id="createBtn">+ Создать тетрадь</button>
    </div>

    <!-- Тетрадный лист по центру -->
    <div class="notebook-page">
        <div id="placeholder" class="placeholder-text">Откройте меню и выберите или создайте тетрадь</div>
        <div id="editorContainer" class="hidden" style="display: flex; flex-direction: column; height: 100%;">
            <input type="text" id="pageTitle" class="page-title" placeholder="Название тетради">
            <textarea id="pageContent" class="page-content" placeholder="Начните писать здесь..."></textarea>
        </div>
    </div>

    <script>
        // Элементы DOM
        const menuBtn = document.getElementById('menuBtn');
        const sidebar = document.getElementById('sidebar');
        const notebookList = document.getElementById('notebookList');
        const createBtn = document.getElementById('createBtn');
        const placeholder = document.getElementById('placeholder');
        const editorContainer = document.getElementById('editorContainer');
        const pageTitle = document.getElementById('pageTitle');
        const pageContent = document.getElementById('pageContent');

        // Состояние приложения
        let notebooks = JSON.parse(localStorage.getItem('notebooks')) || [];
        let currentNotebookId = null;

        // Открытие / Закрытие меню
        menuBtn.addEventListener('click', (e) => {
            sidebar.classList.toggle('active');
            e.stopPropagation(); // Чтобы клик не закрывал меню сразу
        });

        // Закрываем меню при клике на лист или пустую область
        document.addEventListener('click', (e) => {
            if (!sidebar.contains(e.target) && e.target !== menuBtn) {
                sidebar.classList.remove('active');
            }
        });

        // Сохранение в LocalStorage
        function saveToData() {
            localStorage.setItem('notebooks', JSON.stringify(notebooks));
        }

        // Рендер списка тетрадей в меню
        function renderSidebar() {
            notebookList.innerHTML = '';
            notebooks.forEach(notebook => {
                const li = document.createElement('li');
                li.className = `notebook-item ${notebook.id === currentNotebookId ? 'active' : ''}`;
                li.dataset.id = notebook.id;

                const titleSpan = document.createElement('span');
                titleSpan.textContent = notebook.title || 'Без названия';
                titleSpan.style.overflow = 'hidden';
                titleSpan.style.textOverflow = 'ellipsis';
                titleSpan.style.whiteSpace = 'nowrap';
                
                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.textContent = '×';
                
                // Удаление тетради
                delBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    deleteNotebook(notebook.id);
                });

                // Выбор тетради
                li.addEventListener('click', () => {
                    selectNotebook(notebook.id);
                    sidebar.classList.remove('active'); // Закрываем меню после выбора
                });

                li.appendChild(titleSpan);
                li.appendChild(delBtn);
                notebookList.appendChild(li);
            });
        }

        // Создание новой тетради
        createBtn.addEventListener('click', () => {
            const newNotebook = {
                id: Date.now().toString(),
                title: 'Новая тетрадь',
                content: ''
            };
            notebooks.push(newNotebook);
            saveToData();
            renderSidebar();
            selectNotebook(newNotebook.id);
        });

        // Выбор тетради для редактирования
        function selectNotebook(id) {
            currentNotebookId = id;
            const notebook = notebooks.find(n => n.id === id);
            
            if (notebook) {
                placeholder.classList.add('hidden');
                editorContainer.classList.remove('hidden');
                pageTitle.value = notebook.title;
                pageContent.value = notebook.content;
            } else {
                currentNotebookId = null;
                placeholder.classList.remove('hidden');
                editorContainer.classList.add('hidden');
            }
            renderSidebar();
        }

        // Удаление тетради
        function deleteNotebook(id) {
            notebooks = notebooks.filter(n => n.id !== id);
            saveToData();
            if (currentNotebookId === id) {
                selectNotebook(null);
            } else {
                renderSidebar();
            }
        }

        // Автосохранение при вводе текста
        pageTitle.addEventListener('input', () => {
            if (!currentNotebookId) return;
            const notebook = notebooks.find(n => n.id === currentNotebookId);
            if (notebook) {
                notebook.title = pageTitle.value;
                saveToData();
                
                // Обновляем текст в меню без полного перерендера, чтобы не терялся фокус
                const item = notebookList.querySelector(`[data-id="${currentNotebookId}"] span`);
                if (item) item.textContent = pageTitle.value || 'Без названия';
            }
        });

        pageContent.addEventListener('input', () => {
            if (!currentNotebookId) return;
            const notebook = notebooks.find(n => n.id === currentNotebookId);
            if (notebook) {
                notebook.content = pageContent.value;
                saveToData();
            }
        });

        // Инициализация при загрузке
        renderSidebar();
    </script>
</body>
</html>
