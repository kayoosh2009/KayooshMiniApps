<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Тёмный Текстовый Редактор</title>
    <style>
        /* Базовые стили для темной темы */
        body {
            background-color: #121212;
            color: #e0e0e0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        /* Скрытие скроллбаров для всех элементов во всех браузерах */
        * {
            scrollbar-width: none; /* Firefox */
            -ms-overflow-style: none; /* IE/Edge */
            box-sizing: border-box;
        }
        *::-webkit-scrollbar {
            display: none; /* Chrome, Safari, Opera */
        }

        /* Боковая панель для файлов */
        .sidebar {
            width: 250px;
            background-color: #181818;
            border-right: 1px solid #252525;
            display: flex;
            flex-direction: column;
            height: 100%;
            z-index: 10;
            transition: transform 0.3s ease, margin-left 0.3s ease;
        }

        /* Класс для сворачивания сайдбара */
        .sidebar.collapsed {
            margin-left: -250px;
        }

        .sidebar-header {
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #252525;
            height: 70px;
        }

        .sidebar-title {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: #888;
            margin: 0;
        }

        .add-btn {
            background: none;
            border: 1px solid #444;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
            border-radius: 4px;
            width: 28px;
            height: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s;
        }

        .add-btn:hover {
            background-color: #2a2a2a;
        }

        .file-list {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .file-item:hover {
            background-color: #222;
        }

        .file-item.active {
            background-color: #2a2a2a;
            color: #fff;
        }

        .file-name-container {
            flex: 1;
            display: flex;
            align-items: center;
            overflow: hidden;
        }

        .file-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-size: 14px;
            border: none;
            background: transparent;
            color: inherit;
            width: 100%;
            outline: none;
            pointer-events: none;
        }

        .file-name.editing {
            pointer-events: auto;
            background-color: #121212;
            padding: 2px 5px;
            border-radius: 4px;
        }

        .file-actions {
            display: flex;
            gap: 8px;
            opacity: 0;
            transition: opacity 0.2s;
            align-items: center;
        }

        .file-item:hover .file-actions {
            opacity: 1;
        }

        .action-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .action-icon {
            width: 16px;
            height: 16px;
            opacity: 0.6;
            transition: opacity 0.2s;
        }

        .action-btn:hover .action-icon {
            opacity: 1;
        }

        /* Главная рабочая область */
        .main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            height: 100%;
            position: relative;
            background-color: #121212;
        }

        /* Верхняя панель управления (для кнопки меню) */
        .top-bar {
            height: 50px;
            padding: 10px 20px;
            display: flex;
            align-items: center;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 5;
        }

        .menu-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            transition: background-color 0.2s;
        }

        .menu-btn:hover {
            background-color: #222;
        }

        .menu-icon {
            width: 22px;
            height: 22px;
        }

        /* Контейнер редактора во весь экран */
        .editor-container {
            width: 100%;
            max-width: 800px;
            height: 100%;
            display: flex;
            flex-direction: column;
            margin: 0 auto;
            padding: 60px 20px 60px 20px; /* Отступ сверху под кнопку меню */
        }

        /* Поле ввода текста */
        textarea {
            width: 100%;
            height: 100%;
            background-color: transparent;
            color: #ffffff;
            border: none;
            font-size: 18px;
            line-height: 1.6;
            resize: none;
            outline: none;
            overflow-y: auto;
            padding: 0;
        }

        /* Панель инструментов внизу */
        .footer-panel {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 760px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-family: monospace;
            font-size: 13px;
            color: #666;
            pointer-events: none;
        }

        .footer-panel * {
            pointer-events: auto;
        }

        /* Кнопка скачивания .txt */
        .download-btn {
            background-color: #1e1e1e;
            color: #a0a0a0;
            border: 1px solid #333;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: sans-serif;
            font-size: 12px;
            transition: all 0.2s;
        }

        .download-btn:hover {
            background-color: #2a2a2a;
            border-color: #555;
            color: #fff;
        }

        .stats {
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <h3 class="sidebar-title">Файлы</h3>
            <button class="add-btn" id="addFileBtn" title="Создать файл">+</button>
        </div>
        <div class="file-list" id="fileList">
            </div>
    </div>

    <div class="main-content">
        <div class="top-bar">
            <button class="menu-btn" id="toggleMenuBtn" title="Показать/скрыть меню">
                <img src="icons/menu.png" alt="Menu" class="menu-icon">
            </button>
        </div>

        <div class="editor-container">
            <textarea id="textInput" placeholder="Начните писать ваш текст здесь..."></textarea>

            <div class="footer-panel">
                <button class="download-btn" id="downloadBtn">Скачать .txt</button>
                <div class="stats" id="statsPanel">
                    words 0 | chars 0 | size 0.0000 mb
                </div>
            </div>
        </div>
    </div>

    <script>
        const textarea = document.getElementById('textInput');
        const statsPanel = document.getElementById('statsPanel');
        const downloadBtn = document.getElementById('downloadBtn');
        const fileListContainer = document.getElementById('fileList');
        const addFileBtn = document.getElementById('addFileBtn');
        const sidebar = document.getElementById('sidebar');
        const toggleMenuBtn = document.getElementById('toggleMenuBtn');

        // Загрузка состояния файлов и активного файла
        let files = JSON.parse(localStorage.getItem('editor_files')) || {};
        let activeFileId = localStorage.getItem('editor_active_id') || null;
        // Загрузка состояния видимости меню (по умолчанию открыто)
        let isMenuCollapsed = localStorage.getItem('editor_menu_collapsed') === 'true';

        // Инициализация дефолтных данных, если хранилище пустое
        if (Object.keys(files).length === 0) {
            const defaultId = 'file_' + Date.now();
            files[defaultId] = {
                id: defaultId,
                name: 'Черновик 1',
                content: ''
            };
            activeFileId = defaultId;
            saveToStorage();
        }

        // Применяем сохраненное состояние меню при старте
        if (isMenuCollapsed) {
            sidebar.classList.add('collapsed');
        }

        // Сохранение состояния в LocalStorage
        function saveToStorage() {
            localStorage.setItem('editor_files', JSON.stringify(files));
            localStorage.setItem('editor_active_id', activeFileId);
            localStorage.setItem('editor_menu_collapsed', isMenuCollapsed);
        }

        // Обновление статистики текста
        function updateStats(text) {
            const wordsMatch = text.trim().match(/\s+/g);
            const words = text.trim() === '' ? 0 : (wordsMatch ? wordsMatch.length + 1 : 1);
            const chars = text.length;
            const byteSize = new Blob([text]).size;
            const sizeInMb = (byteSize / (1024 * 1024)).toFixed(4);

            statsPanel.textContent = `words ${words} | chars ${chars} | size ${sizeInMb} mb`;
        }

        // Рендер списка файлов в сайдбаре
        function renderFileList() {
            fileListContainer.innerHTML = '';

            Object.values(files).forEach(file => {
                const fileItem = document.createElement('div');
                fileItem.className = `file-item ${file.id === activeFileId ? 'active' : ''}`;
                fileItem.dataset.id = file.id;

                const nameContainer = document.createElement('div');
                nameContainer.className = 'file-name-container';

                const inputName = document.createElement('input');
                inputName.className = 'file-name';
                inputName.value = file.name;
                inputName.maxLength = 30;
                inputName.readOnly = true;

                nameContainer.appendChild(inputName);

                // Панель с кнопками управления на основе картинок-иконок
                const actions = document.createElement('div');
                actions.className = 'file-actions';

                const editBtn = document.createElement('button');
                editBtn.className = 'action-btn';
                editBtn.title = 'Переименовать';
                const editIcon = document.createElement('img');
                editIcon.src = 'icons/pencil.png';
                editIcon.className = 'action-icon';
                editIcon.alt = 'Edit';
                editBtn.appendChild(editIcon);

                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'action-btn';
                deleteBtn.title = 'Удалить';
                const deleteIcon = document.createElement('img');
                deleteIcon.src = 'icons/trush.png';
                deleteIcon.className = 'action-icon';
                deleteIcon.alt = 'Delete';
                deleteBtn.appendChild(deleteIcon);

                actions.appendChild(editBtn);
                actions.appendChild(deleteBtn);
                fileItem.appendChild(nameContainer);
                fileItem.appendChild(actions);
                fileListContainer.appendChild(fileItem);

                // --- Обработчики событий ---

                // Переключение на файл
                fileItem.addEventListener('click', (e) => {
                    if (e.target.closest('.action-btn') || inputName.classList.contains('editing')) return;
                    switchToFile(file.id);
                });

                // Включение режима редактирования имени
                const startRename = () => {
                    inputName.readOnly = false;
                    inputName.classList.add('editing');
                    inputName.focus();
                    inputName.select();
                };

                editBtn.addEventListener('click', startRename);
                inputName.addEventListener('dblclick', startRename);

                // Завершение переименования
                const finishRename = () => {
                    inputName.readOnly = true;
                    inputName.classList.remove('editing');
                    const newName = inputName.value.trim() || 'Без названия';
                    files[file.id].name = newName;
                    inputName.value = newName;
                    saveToStorage();
                };

                inputName.addEventListener('blur', finishRename);
                inputName.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter') finishRename();
                });

                // Удаление файла
                deleteBtn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (Object.keys(files).length <= 1) {
                        alert('Нельзя удалить единственный файл!');
                        return;
                    }
                    if (confirm(`Удалить файл "${file.name}"?`)) {
                        delete files[file.id];
                        if (activeFileId === file.id) {
                            activeFileId = Object.keys(files)[0];
                        }
                        saveToStorage();
                        renderFileList();
                        loadActiveFile();
                    }
                });
            });
        }

        // Переключение на выбранный файл
        function switchToFile(id) {
            activeFileId = id;
            saveToStorage();
            renderFileList();
            loadActiveFile();
        }

        // Загрузка контента активного файла
        function loadActiveFile() {
            const currentFile = files[activeFileId];
            if (currentFile) {
                textarea.value = currentFile.content;
                updateStats(currentFile.content);
            }
        }

        // Добавление нового файла
        addFileBtn.addEventListener('click', () => {
            const newId = 'file_' + Date.now();
            files[newId] = {
                id: newId,
                name: `Черновик ${Object.keys(files).length + 1}`,
                content: ''
            };
            activeFileId = newId;
            saveToStorage();
            renderFileList();
            loadActiveFile();
            textarea.focus();
        });

        // Слушатель ввода текста
        textarea.addEventListener('input', () => {
            if (files[activeFileId]) {
                files[activeFileId].content = textarea.value;
                saveToStorage();
                updateStats(textarea.value);
            }
        });

        // Переключение видимости меню (складывание в иконку)
        toggleMenuBtn.addEventListener('click', () => {
            isMenuCollapsed = !isMenuCollapsed;
            if (isMenuCollapsed) {
                sidebar.classList.add('collapsed');
            } else {
                sidebar.classList.remove('collapsed');
            }
            saveToStorage();
        });

        // Функция скачивания активного файла
        downloadBtn.addEventListener('click', () => {
            const currentFile = files[activeFileId];
            const text = textarea.value;

            if (!text) {
                alert('Нечего скачивать, поле пустое!');
                return;
            }

            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);

            const link = document.createElement('a');
            link.href = url;
            link.download = `${currentFile.name}.txt`;

            document.body.appendChild(link);
            link.click();

            document.body.removeChild(link);
            URL.revokeObjectURL(url);
        });

        // Старт приложения
        window.addEventListener('DOMContentLoaded', () => {
            renderFileList();
            loadActiveFile();
        });
    </script>
</body>
</html>
